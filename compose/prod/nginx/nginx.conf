upstream django_app {
    server web:8000;
}

server {
    server_name     www.vintagecell.com;
    listen          443 ssl;
    # listen          443 ssl proxy_protocol;
    # listen          443 ssl http2;

    gzip                on;
    gzip_disable        "msie6";
    gzip_types          text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/x-icon image/bmp;
    gzip_buffers        16 8k;
    gzip_comp_level     4;
    gzip_http_version   1.0;
    gzip_min_length     1280;
    gzip_vary           on;

    ssl_certificate     "/etc/nginx/ssl/vintagecell_co.crt";
    ssl_certificate_key "/etc/nginx/ssl/vintagecell_co.key";
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 20M;
    }

    location /static/ {
        alias /cell_store/staticfiles/;
    }

    location /media/ {
        alias /cell_store/mediafiles/;
    }

}

server {
    # listen 80 proxy_protocol;
    listen 80;
    server_name www.vintagecell.com;
    gzip                on;
    gzip_disable        "msie6";
    gzip_types          text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/x-icon image/bmp;
    gzip_buffers        16 8k;
    gzip_comp_level     4;
    gzip_http_version   1.0;
    gzip_min_length     1280;
    gzip_vary           on;

    # set_real_ip_from 0.0.0.0/0; # Or your LB's IP range
    # real_ip_header proxy_protocol;
    # real_ip_recursive on;
    
    
    # if ($http_x_forwarded_proto != "https") {
    #     return 301 https://$host$request_uri;
    # }
    
    # location / {
	#     return 301 https://$host$request_uri;
    # }

    return 301 https://$host$request_uri;
}

